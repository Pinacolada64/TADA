name: Build standalone client

# Builds the PyInstaller --onedir bundle of server/tada_client.py for
# Linux, Windows and macOS and uploads each as a downloadable .zip.
#
# Triggers:
#   - manual run from the Actions tab (workflow_dispatch)
#   - pushing a tag like client-v1.0 (also attaches the zips to a GitHub Release)

on:
  workflow_dispatch:
  push:
    tags:
      - 'client-v*'

permissions:
  contents: write        # needed only for the Release upload on tag builds

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false     # one OS failing must not cancel the others
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install prompt_toolkit pyinstaller

      - name: Build client
        working-directory: server
        run: pyinstaller tada-client.spec

      - name: Smoke-test the frozen binary (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: server
        run: ./dist/tada-client/tada-client --help

      - name: Smoke-test the frozen binary (Windows)
        if: runner.os == 'Windows'
        working-directory: server
        run: .\dist\tada-client\tada-client.exe --help

      - name: Package bundle into a zip
        working-directory: server
        run: python -c "import shutil; shutil.make_archive('tada-client-${{ matrix.name }}', 'zip', 'dist/tada-client')"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tada-client-${{ matrix.name }}
          path: server/tada-client-${{ matrix.name }}.zip
          if-no-files-found: error

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/client-v')
        uses: softprops/action-gh-release@v2
        with:
          files: server/tada-client-${{ matrix.name }}.zip
